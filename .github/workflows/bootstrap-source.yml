name: Bootstrap cleaned source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-source.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore prepared V3.4 source snapshot
        run: |
          cat bootstrap/source.part00.b64 \
              bootstrap/source.part00tail.b64 \
              bootstrap/source.part01.b64 \
              bootstrap/source.part02.b64 | base64 -d > source.zip
          unzip -oq source.zip
          rm source.zip
      - name: Commit cleaned source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt cmake src
          git commit -m "Import exact V3.4 source snapshot" || exit 0
          git push
